name: Cache Demo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  cache-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: cache-825858f-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            cache-825858f-${{ runner.os }}-
            cache-825858f-
      
      - name: prime-cache-825858f
        run: |
          if [ "${{ steps.cache.outputs.cache-hit }}" == "true" ]; then
            echo "Cache hit! Using cached dependencies"
          else
            echo "Cache miss! Will create new cache"
            # Create some files to cache
            mkdir -p ~/.npm
            echo "cached content" > ~/.npm/test.txt
          fi
